name: Coursework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: cmake -S . -B build && cmake --build build
      - run: python tests/check_examples.py build
      - run: python -m compileall -q python
      - run: mkdir -p java/travel-destinations/build && javac -d java/travel-destinations/build java/travel-destinations/src/TopFiveDestinationList.java
